version: 2

models:
  - name: stg_customers
    description: "One row per customer from SRC03, cleaned and typed. PK customer_id; 2,000 rows."
    data_tests:
      - row_count_equals:
          arguments:
            expected: 2000
    columns:
      - name: customer_id
        description: "Customer code (e.g. CUS00001), upper-case; primary key."
        data_tests:
          - unique
          - not_null
      - name: customer_name
        description: "Customer (shop) name in Vietnamese."
      - name: customer_type
        description: "Type of outlet, Vietnamese value (e.g. Tạp hóa, Siêu thị)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Canteen', 'Cửa hàng tiện lợi', 'Nhà hàng', 'Online Seller', 'Siêu thị', 'Tạp hóa']
      - name: channel
        description: "Sales channel of the customer."
        data_tests:
          - accepted_values:
              arguments:
                values: ['E-commerce', 'Modern Trade', 'Traditional Trade']
      - name: province
        description: "Province of the customer, Vietnamese value."
      - name: region
        description: "Region of the customer: Miền Bắc, Miền Trung or Miền Nam."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Miền Bắc', 'Miền Nam', 'Miền Trung']
      - name: address
        description: "Street address, Vietnamese free text."
      - name: phone
        description: "Phone number as text, 11 digits starting with 0 (DQ12)."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^0[0-9]{10}$'"
      - name: tax_code
        description: "Tax code as text, 10 digits; NULL for 1,035 customers (DQ13)."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^[0-9]{10}$'"
              config:
                where: "tax_code is not null"
      - name: join_date
        description: "Date the customer joined."
      - name: credit_limit
        description: "Credit limit in VND, numeric(18,2)."
      - name: status
        description: "Customer status: Active or Inactive (the 157 Inactive are the unmapped customers, DQ10)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Inactive']
      - name: _source_file
        description: "Lineage: source file name."
      - name: _row_number
        description: "Lineage: row in the source file (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_products
    description: "One row per product from SRC04 (sheet Products), cleaned and typed. PK product_id; 100 rows."
    data_tests:
      - row_count_equals:
          arguments:
            expected: 100
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cost_price <= unit_price"
    columns:
      - name: product_id
        description: "Product code (e.g. PRD0001), upper-case; primary key."
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name in Vietnamese."
      - name: category
        description: "Product category, Vietnamese value (e.g. Thực phẩm, Thức uống)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Chăm sóc cá nhân', 'Gia dụng', 'Thực phẩm', 'Thức uống']
      - name: sub_category
        description: "Product sub-category, Vietnamese value (e.g. Mì ăn liền)."
      - name: unit
        description: "Sales unit, Vietnamese value (e.g. Chai, Hộp, Thùng)."
      - name: unit_price
        description: "List price per unit in VND, numeric(18,2)."
      - name: cost_price
        description: "Cost price per unit in VND, numeric(18,2); never above unit_price."
      - name: weight_gram
        description: "Weight per unit in grams."
      - name: status
        description: "Product status: Active or Discontinued."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Discontinued']
      - name: launch_date
        description: "Date the product was launched."
      - name: _source_file
        description: "Lineage: source file name."
      - name: _sheet_name
        description: "Lineage: Excel sheet the row came from (Products)."
      - name: _row_number
        description: "Lineage: row in the source sheet (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_employees
    description: "One row per employee per version from SRC07 (v1 = start of year, v2 = July adjustment). PK employee_id + employee_version; 114 rows per version."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['employee_id', 'employee_version']
      - row_count_equals:
          arguments:
            expected: 228
      - dbt_utils.expression_is_true:
          arguments:
            expression: "employee_version = source_version"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "resign_date is null and transfer_note is null"
          config:
            where: "employee_version = 'v1'"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "resign_date >= join_date"
          config:
            where: "resign_date is not null"
    columns:
      - name: employee_id
        description: "Employee code (e.g. EMP1001), upper-case; with employee_version the primary key."
        data_tests:
          - not_null
      - name: employee_version
        description: "Version from the sheet name: v1 (Employee_v1_StartYear) or v2 (Employee_v2_Adjustment)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['v1', 'v2']
      - name: source_version
        description: "Raw `version` column; must equal employee_version."
      - name: full_name
        description: "Employee full name in Vietnamese."
      - name: gender
        description: "Gender, Vietnamese value: Nam (male) or Nữ (female)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Nam', 'Nữ']
      - name: position
        description: "Job title (e.g. Sales Representative, Sales Supervisor)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Area Manager', 'Sales Representative', 'Sales Supervisor', 'Senior Sales Representative']
      - name: region
        description: "Region of the employee in this version: Miền Bắc, Miền Trung or Miền Nam."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Miền Bắc', 'Miền Nam', 'Miền Trung']
      - name: team
        description: "Sales team in this version (e.g. Team Bắc 1, Management)."
      - name: email
        description: "Work email address."
      - name: phone
        description: "Phone number as text, 10 digits starting with 0 (DQ12)."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^0[0-9]{9}$'"
      - name: status
        description: "Employment status in this version: Active or Resigned."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Resigned']
      - name: date_of_birth
        description: "Date of birth."
      - name: join_date
        description: "Date the employee joined the company."
      - name: effective_date
        description: "Date this version became valid (2024-01-01 for v1, 2024-07-01 for v2)."
      - name: resign_date
        description: "True end of employment (A-DQ08); set for the 8 resigned employees in v2 only."
      - name: transfer_note
        description: "Free-text note on a region transfer (v2 only, DQ11)."
      - name: _source_file
        description: "Lineage: source file name."
      - name: _sheet_name
        description: "Lineage: Excel sheet the row came from; also the version key."
      - name: _row_number
        description: "Lineage: row in the source sheet (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_employee_changes
    description: "One row per HR change from the SRC07 Change_Log sheet: 8 resignations and 5 region transfers; 13 rows."
    data_tests:
      - row_count_equals:
          arguments:
            expected: 13
      - dbt_utils.expression_is_true:
          arguments:
            expression: "new_region is not null and new_team is not null"
          config:
            where: "change_type = 'Chuyển vùng'"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "new_region is null and new_team is null"
          config:
            where: "change_type = 'Nghỉ việc'"
    columns:
      - name: employee_id
        description: "Employee code of the changed employee; references stg_employees."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id
      - name: employee_name
        description: "Employee name in Vietnamese."
      - name: change_type
        description: "Type of change, Vietnamese value: Nghỉ việc (resigned) or Chuyển vùng (region transfer)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Nghỉ việc', 'Chuyển vùng']
      - name: effective_date
        description: "Date HR recorded the change (2024-07-01); not the resign date (A-DQ08)."
        data_tests:
          - not_null
      - name: old_region
        description: "Region before the change."
      - name: new_region
        description: "Region after a transfer; NULL for resignations."
      - name: old_team
        description: "Team before the change."
      - name: new_team
        description: "Team after a transfer; NULL for resignations."
      - name: _source_file
        description: "Lineage: source file name."
      - name: _sheet_name
        description: "Lineage: Excel sheet the row came from (Change_Log)."
      - name: _row_number
        description: "Lineage: row in the source sheet (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_distributors
    description: "One row per distributor from SRC06, cleaned and typed. PK distributor_id; 138 rows."
    data_tests:
      - row_count_equals:
          arguments:
            expected: 138
    columns:
      - name: distributor_id
        description: "Distributor code (e.g. DIST0001), upper-case; primary key."
        data_tests:
          - unique
          - not_null
      - name: distributor_name
        description: "Distributor company name in Vietnamese."
      - name: tier
        description: "Distributor tier, Vietnamese value (e.g. Nhà phân phối cấp 1)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Nhà phân phối cấp 1', 'Đại lý cấp 2', 'Điểm bán lẻ']
      - name: channel
        description: "Sales channel of the distributor."
        data_tests:
          - accepted_values:
              arguments:
                values: ['E-commerce', 'Modern Trade', 'Traditional Trade']
      - name: province
        description: "Province of the distributor, Vietnamese value."
      - name: region
        description: "Region of the distributor: Miền Bắc, Miền Trung or Miền Nam."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Miền Bắc', 'Miền Nam', 'Miền Trung']
      - name: contact_person
        description: "Name of the contact person in Vietnamese."
      - name: phone
        description: "Phone number as text, 11 digits starting with 0 (DQ12)."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^0[0-9]{10}$'"
      - name: email
        description: "Contact email address."
      - name: tax_code
        description: "Tax code as text, 10 digits; never NULL in SRC06 (DQ13)."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^[0-9]{10}$'"
      - name: join_date
        description: "Date the distributor joined."
      - name: credit_limit
        description: "Credit limit in VND, numeric(18,2)."
      - name: status
        description: "Distributor status: Active or Inactive."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Inactive']
      - name: supervisor_employee_id
        description: "Employee code of the assigned sales supervisor (raw assigned_supervisor_id, DQ06)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id
      - name: _source_file
        description: "Lineage: source file name."
      - name: _row_number
        description: "Lineage: row in the source file (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_territory_mapping
    description: "One row per mapped customer from SRC08 (single version v1, never updated in 2024). PK customer_id; 1,843 rows."
    data_tests:
      - row_count_equals:
          arguments:
            expected: 1843
      - dbt_utils.expression_is_true:
          arguments:
            expression: "expiry_date >= effective_date"
    columns:
      - name: customer_id
        description: "Customer code; primary key (one rep per customer); references stg_customers."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: territory_id
        description: "Mapping row code (e.g. TER00001)."
      - name: employee_id
        description: "Employee code of the rep the customer is mapped to; references stg_employees."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id
      - name: region
        description: "Region of the mapping as of 2024-01-01 (stale for the 5 July transfers, DQ11)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Miền Bắc', 'Miền Nam', 'Miền Trung']
      - name: team
        description: "Team of the mapped rep as of 2024-01-01."
      - name: effective_date
        description: "Start of validity (2024-01-01 for every row)."
        data_tests:
          - not_null
      - name: expiry_date
        description: "End of validity; 9999-12-31 means open-ended (DQ19)."
        data_tests:
          - not_null
      - name: is_open_ended
        description: "True when expiry_date = 9999-12-31 (no end date)."
      - name: version
        description: "Mapping version; only v1 exists."
        data_tests:
          - accepted_values:
              arguments:
                values: ['v1']
      - name: _source_file
        description: "Lineage: source file name."
      - name: _sheet_name
        description: "Lineage: Excel sheet the row came from (Sheet1)."
      - name: _row_number
        description: "Lineage: row in the source sheet (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_sales_transactions
    description: "One row per sales order line from SRC01, typed, with the post-resign flag. PK order_id + product_id; 119,101 rows; net 158,957,563,200 VND."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['order_id', 'product_id']
      - row_count_equals:
          arguments:
            expected: 119101
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(gross_amount - quantity * unit_price) <= 1"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(discount_amount - gross_amount * discount_pct / 100) <= 50"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(net_amount - (gross_amount - discount_amount)) <= 1"
    columns:
      - name: order_id
        description: "Sales order code (e.g. ORD0010001); with product_id the primary key."
        data_tests:
          - not_null
      - name: product_id
        description: "Product sold on this line; references stg_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: order_date
        description: "Order date (2024-01-01 to 2024-12-31)."
        data_tests:
          - not_null
      - name: customer_id
        description: "Customer of the order; references stg_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: employee_id
        description: "Sales rep on the order; references stg_employees."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id
      - name: channel
        description: "Sales channel of the order (order-level, DQ15)."
      - name: province
        description: "Province of the order (order-level, DQ15), Vietnamese value."
      - name: quantity
        description: "Units sold on the line."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: unit_price
        description: "Price per unit in VND, numeric(18,2)."
      - name: discount_pct
        description: "Discount as a whole percent (2 = 2 %), numeric(5,2) (DQ14)."
      - name: gross_amount
        description: "Stored gross amount in VND (= quantity * unit_price)."
      - name: discount_amount
        description: "Stored discount in VND, rounded to 100 VND by the source (DQ14)."
      - name: net_amount
        description: "Stored net amount in VND (= gross_amount - discount_amount); reconciles to raw."
      - name: delivery_status
        description: "Delivery status of the line (line-level, DQ15): Delivered, Delivering or Cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Delivered', 'Delivering', 'Cancelled']
      - name: payment_method
        description: "Payment method of the line (line-level, DQ15), Vietnamese value."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Chuyển khoản', 'Công nợ', 'Tiền mặt']
      - name: payment_status
        description: "Payment status of the line (line-level, DQ15): Paid, Partial or Unpaid."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Paid', 'Partial', 'Unpaid']
      - name: is_post_resign_sale
        description: "True when order_date > the employee's resign_date (A-DQ08); 547 lines."
        data_tests:
          - not_null
      - name: _source_file
        description: "Lineage: source file name."
      - name: _row_number
        description: "Lineage: row in the source file (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_distributor_orders
    description: "One row per distributor order line from SRC05 (sheet Orders), typed. PK order_id + product_id; 35,945 rows, 8,000 orders."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['order_id', 'product_id']
      - row_count_equals:
          arguments:
            expected: 35945
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qty_delivered <= qty_ordered"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "actual_delivery_date >= order_date"
          config:
            where: "actual_delivery_date is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "expected_delivery_date >= order_date"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(fill_rate_pct - qty_delivered::numeric / qty_ordered * 100) <= 0.01"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(gross_amount - qty_ordered * distributor_price) <= 1"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(delivered_amount - qty_delivered * distributor_price) <= 1"
    columns:
      - name: order_id
        description: "Distributor order code (e.g. DORD0020001); with product_id the primary key."
        data_tests:
          - not_null
      - name: product_id
        description: "Product ordered on this line; references stg_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: distributor_id
        description: "Ordering distributor; references stg_distributors."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_distributors')
                field: distributor_id
      - name: order_date
        description: "Order date (2024)."
        data_tests:
          - not_null
      - name: expected_delivery_date
        description: "Promised delivery date; reaches 2025-01-02 (DQ19)."
        data_tests:
          - not_null
      - name: actual_delivery_date
        description: "Actual delivery date; filled on every line, also on Cancelled lines."
      - name: channel
        description: "Sales channel of the distributor order."
        data_tests:
          - accepted_values:
              arguments:
                values: ['E-commerce', 'Modern Trade', 'Traditional Trade']
      - name: qty_ordered
        description: "Units ordered."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: qty_delivered
        description: "Units delivered; never above qty_ordered."
        data_tests:
          - not_null
      - name: unit_price_list
        description: "List price per unit in VND, numeric(18,2)."
      - name: distributor_price
        description: "Price per unit charged to the distributor in VND, numeric(18,2)."
      - name: fill_rate_pct
        description: "Stored fill rate in percent = qty_delivered / qty_ordered * 100, numeric(5,2) (DQ20)."
      - name: gross_amount
        description: "Stored ordered value in VND = qty_ordered * distributor_price (DQ20)."
      - name: delivered_amount
        description: "Stored delivered value in VND = qty_delivered * distributor_price (DQ20)."
      - name: ontime_delivery
        description: "Stored on-time flag, Yes or No; differs from the dates on 177 lines (DQ20)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Yes', 'No']
      - name: delivery_status
        description: "Delivery status of the line: Delivered, Partial or Cancelled."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Delivered', 'Partial', 'Cancelled']
      - name: payment_terms
        description: "Payment terms: COD, NET15, NET30 or NET45."
        data_tests:
          - accepted_values:
              arguments:
                values: ['COD', 'NET15', 'NET30', 'NET45']
      - name: _source_file
        description: "Lineage: source file name."
      - name: _sheet_name
        description: "Lineage: Excel sheet the row came from (Orders)."
      - name: _row_number
        description: "Lineage: row in the source sheet (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_returns
    description: "One row per returned sales line from SRC09, typed and linked to stg_sales_transactions. PK return_id; 3,665 rows."
    data_tests:
      - row_count_equals:
          arguments:
            expected: 3665
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(return_amount - return_quantity * unit_price) <= 1"
    columns:
      - name: return_id
        description: "Return code (e.g. RET000001); primary key."
        data_tests:
          - unique
          - not_null
      - name: original_order_id
        description: "Sales order the return belongs to; with product_id points to one stg_sales_transactions line (DQ07)."
        data_tests:
          - not_null
      - name: product_id
        description: "Returned product; references stg_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: customer_id
        description: "Customer who returned the goods; references stg_customers and equals the sales line's customer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: employee_id
        description: "Sales rep of the original sale; references stg_employees and equals the sales line's rep."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id
      - name: return_date
        description: "Date of the return; never before the order date."
        data_tests:
          - not_null
      - name: return_quantity
        description: "Units returned; never above the units sold (DQ07)."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: unit_price
        description: "Price per unit in VND, numeric(18,2)."
      - name: return_amount
        description: "Returned value in VND = return_quantity * unit_price, numeric(18,2)."
      - name: return_reason
        description: "Reason for the return, Vietnamese value (e.g. Hàng lỗi = defective goods)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Hàng hết hạn', 'Hàng lỗi', 'Hàng vỡ vận chuyển', 'Khách từ chối nhận', 'Không đúng đơn hàng', 'Sai sản phẩm']
      - name: status
        description: "Processing status of the return, Vietnamese value (Đã xử lý, Đang xử lý, Từ chối)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Đã xử lý', 'Đang xử lý', 'Từ chối']
      - name: _source_file
        description: "Lineage: source file name."
      - name: _row_number
        description: "Lineage: row in the source file (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_promotions
    description: "One row per promotion from SRC10, typed; the product list moves to stg_promotion_products. PK promotion_id; 40 rows."
    data_tests:
      - row_count_equals:
          arguments:
            expected: 40
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_date >= start_date"
    columns:
      - name: promotion_id
        description: "Promotion code (e.g. PROMO001); primary key."
        data_tests:
          - unique
          - not_null
      - name: promotion_name
        description: "Internal promotion name (e.g. CT_XUAN_2024_02)."
      - name: promotion_type
        description: "Type of promotion, Vietnamese value (e.g. Giảm giá trực tiếp = direct discount)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Chiết khấu theo sản lượng', 'Combo khuyến mãi', 'Giảm giá trực tiếp', 'Tặng hàng kèm', 'Tích điểm đổi quà']
      - name: target_channel
        description: "Channel the promotion targets; All = every channel."
        data_tests:
          - accepted_values:
              arguments:
                values: ['All', 'E-commerce', 'Modern Trade', 'Traditional Trade']
      - name: target_region
        description: "Region the promotion targets; All = every region."
        data_tests:
          - accepted_values:
              arguments:
                values: ['All', 'Miền Bắc', 'Miền Nam', 'Miền Trung']
      - name: start_date
        description: "First day of the promotion."
        data_tests:
          - not_null
      - name: end_date
        description: "Last day of the promotion; never before start_date."
        data_tests:
          - not_null
      - name: discount_pct
        description: "Discount as a whole percent (8 = 8 %), numeric(5,2)."
      - name: min_order_quantity
        description: "Minimum order quantity to qualify (0 = no minimum)."
      - name: budget_vnd
        description: "Planned budget in VND, numeric(18,2)."
      - name: actual_cost_vnd
        description: "Actual cost in VND, numeric(18,2); above budget for 6 promotions (BR5 input)."
      - name: status
        description: "Promotion status: Active, Completed or Planned."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Completed', 'Planned']
      - name: created_by
        description: "Name of the person who created the promotion (free text, not an employee id)."
      - name: _source_file
        description: "Lineage: source file name."
      - name: _sheet_name
        description: "Lineage: Excel sheet the row came from (Sheet1)."
      - name: _row_number
        description: "Lineage: row in the source sheet (header = 1)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."

  - name: stg_promotion_products
    description: "One row per promotion x product, split from SRC10 applicable_products (DQ17). 145 rows."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['promotion_id', 'product_id']
      - row_count_equals:
          arguments:
            expected: 145
    columns:
      - name: promotion_id
        description: "Promotion code; references stg_promotions."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_promotions')
                field: promotion_id
      - name: product_id
        description: "Product covered by the promotion; references stg_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: position_in_list
        description: "Position of the product in the original applicable_products list (1 = first)."
      - name: _source_file
        description: "Lineage: source file name."
      - name: _sheet_name
        description: "Lineage: Excel sheet the row came from (Sheet1)."
      - name: _row_number
        description: "Lineage: row of the promotion in the source sheet (shared by its products)."
      - name: _batch_id
        description: "Lineage: loader run id, joins to raw.ingest_log.batch_id."
      - name: _loaded_at
        description: "Lineage: load timestamp (UTC)."
